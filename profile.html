<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <script>(function(){try{var s=JSON.parse(localStorage.getItem('bm_settings')||'{}');if({blue:1,purple:1,white:1,pink:1,amber:1}[s.bgTheme])document.documentElement.setAttribute('data-bg',s.bgTheme);}catch(e){}})();</script>
  <title>薄肌健康 · 档案</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="icons/icon-192.png">
</head>
<body>
  <div class="container">
    <h1><span class="logo">📋</span> 我的档案</h1>

    <div class="card">
      <h2>使用状态</h2>
      <p class="small">开始日期：<span class="accent" id="startDateText">--</span>（首次保存档案时自动记录，不可手动修改）</p>
      <p class="small">已使用 <span class="accent" id="daysUsedText">0</span> 天 · 当前第 <span class="accent" id="weekText">1</span> 周</p>
      <p class="small">当前基础代谢：<span class="accent" id="bmrNowText">--</span> kcal（<span id="bmrSourceText">未设置</span>）</p>
    </div>

    <form id="profileForm" class="card" novalidate>
      <label>性别</label>
      <select id="gender" required>
        <option value="male">男</option>
        <option value="female">女</option>
      </select>

      <div class="form-row">
        <div>
          <label>年龄（岁）</label>
          <input type="number" id="age" min="10" max="100" required>
        </div>
        <div>
          <label>身高（cm）</label>
          <input type="number" id="height" min="100" max="250" step="0.1" required>
        </div>
      </div>

      <div class="form-row">
        <div>
          <label>体重（kg）</label>
          <input type="number" id="weight" min="30" max="300" step="0.1" required>
        </div>
        <div>
          <label>目标方向</label>
          <select id="goalType">
            <option value="减脂">减脂</option>
            <option value="增肌">增肌</option>
            <option value="维持">维持</option>
          </select>
        </div>
      </div>
      <p class="muted small field-note">体重与日复盘、周复盘填写的体重保持同步，改任意一处即可。</p>

      <label>活动水平</label>
      <select id="activity">
        <option value="久坐">久坐 1.2（几乎不运动，日常办公）</option>
        <option value="轻度活动">轻度 1.375（每周运动1-3天）</option>
        <option value="中度活动">中度 1.55（每周运动3-5天）</option>
        <option value="高度活动">高强度 1.725（每周运动6-7天）</option>
      </select>

      <label>基础代谢（kcal）</label>
      <input type="number" id="bmrManual" min="600" max="4000" step="1" placeholder="也可手动填写，留空则由AI估算">
      <p class="muted small field-note">周复盘解析后会自动更新（优先级最高），也可手动填写。建议每次周复盘后确认一次。</p>

      <div class="form-row">
        <div>
          <label>日均饮水量（ml）</label>
          <input type="number" id="waterHabit" min="0" max="8000" step="50" placeholder="供AI提示词参考">
        </div>
        <div>
          <label>睡眠时长（小时）</label>
          <input type="number" id="sleepH" min="2" max="14" step="0.5" placeholder="供AI提示词参考">
        </div>
      </div>

      <label>日均步数 / 运动习惯（文字）</label>
      <input type="text" id="habit" placeholder="例：日均6000步，每周2次力量训练">

      <br>
      <button type="submit" class="btn btn-block">保存档案</button>
    </form>

    <div class="card">
      <h2>下一步</h2>
      <p class="small" style="line-height:1.8">
        1️⃣ 保存档案后，去 <a href="sleep.html" class="accent">🌙 睡眠页</a> 记录昨晚睡眠；<br>
        2️⃣ 在睡眠页点"生成AI提示词"（会自动带上你的档案与睡眠），发给手机AI；<br>
        3️⃣ 把AI回复粘贴回睡眠页导入，饮水/饮食/运动/首页目标会自动联动。
      </p>
    </div>
  </div>

  <nav class="tabbar">
    <a href="index.html"><span class="tab-icon">🏠</span>首页</a>
    <a href="water.html"><span class="tab-icon">💧</span>大水</a>
    <a href="eat.html"><span class="tab-icon">🍚</span>饮食</a>
    <a href="move.html"><span class="tab-icon">🏃</span>运动</a>
    <a href="sleep.html"><span class="tab-icon">🌙</span>睡眠</a>
    <a href="week.html"><span class="tab-icon">📈</span>复盘</a>
  </nav>

  <script src="js/storage.js"></script>
  <script src="js/calculator.js"></script>
  <script src="js/exporter.js"></script>
  <script src="js/menu.js"></script>
  <script src="js/app.js"></script>
  <script>
    (function () {
      Store.migrate();
      var form = document.getElementById('profileForm');
      var fields = ['gender', 'age', 'height', 'weight', 'goalType', 'activity', 'bmrManual', 'waterHabit', 'sleepH', 'habit'];

      var p = Store.getProfile();
      if (p) {
        fields.forEach(function (id) {
          var el = document.getElementById(id);
          if (p[id] !== undefined && p[id] !== null && p[id] !== '') el.value = p[id];
        });
      }

      function renderStatus() {
        var prof = Store.getProfile();
        var bmr = Store.bmrNow();
        document.getElementById('startDateText').textContent = (prof && prof.startDate) || '尚未保存档案';
        document.getElementById('daysUsedText').textContent = prof ? Store.daysUsed() : 0;
        document.getElementById('weekText').textContent = prof ? Store.currentWeek() : 1;
        document.getElementById('bmrNowText').textContent = bmr || '--';
        document.getElementById('bmrSourceText').textContent = bmr ? Store.bmrSourceText() : '未设置';
      }

      /* 目标方向：现在选或等AI建议后再调 */
      document.getElementById('goalType').addEventListener('change', function () {
        openModal('<h2>目标方向</h2>' +
          '<p class="small" style="line-height:1.8">你可以现在选择，也可以等睡眠AI分析后，参考AI建议再回来调整。</p>' +
          '<p class="muted small">当前选择：<span class="accent">' + this.value + '</span></p>');
      });

      function openModal(html) {
        var modal = document.getElementById('bmModal');
        if (!modal) { alert(html.replace(/<[^>]+>/g, '')); return; }
        modal.querySelector('.modal-body').innerHTML = html;
        modal.style.display = 'flex';
      }

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        var data = {};
        fields.forEach(function (id) { data[id] = document.getElementById(id).value; });
        data.age = parseFloat(data.age);
        data.height = parseFloat(data.height);
        data.weight = parseFloat(data.weight);
        data.sleepH = parseFloat(data.sleepH) || null;
        data.waterHabit = parseInt(data.waterHabit, 10) || null;
        data.bmrManual = parseInt(data.bmrManual, 10) || null;
        if (!data.age || !data.height || !data.weight) {
          alert('请填写年龄、身高、体重');
          return;
        }

        var old = Store.getProfile() || {};
        ['ai', 'aiAdvice', 'aiAdviceAt', 'weekReviews', 'goalWeight',
          'waterGoalManual', 'sleepGoal', 'bmrAuto', 'bmrFirstAi', 'startDate', 'closedWeeks',
          'weightHistory'].forEach(function (k) {
          if (old[k] !== undefined) data[k] = old[k];
        });
        data.ai = data.ai || {};
        data.sleepGoal = data.sleepGoal || 8;
        data.updatedAt = new Date().toISOString();

        if (!Store.saveProfile(data)) return;
        // 体重同步（档案/日复盘/周复盘共用一份体重历史）
        Store.setWeight(data.weight);
        renderStatus();
        toast('档案已保存 ✓ 去睡眠页生成AI提示词吧 🌙');
      });

      renderStatus();

      function toast(msg) {
        var t = document.createElement('div');
        t.className = 'toast';
        t.textContent = msg;
        document.body.appendChild(t);
        setTimeout(function () { t.remove(); }, 2200);
      }
    })();
  </script>
</body>
</html>
