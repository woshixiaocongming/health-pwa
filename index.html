<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <script>(function(){try{var s=JSON.parse(localStorage.getItem('bm_settings')||'{}');if({blue:1,purple:1,white:1,pink:1,amber:1}[s.bgTheme])document.documentElement.setAttribute('data-bg',s.bgTheme);}catch(e){}})();</script>
  <title>薄肌健康 · 今日仪表盘</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="icons/icon-192.png">
</head>
<body data-page="index">
  <div class="container">
    <h1><span class="logo">薄肌健康</span>·今日仪表盘</h1>
    <p class="muted small" id="weekLine" style="margin:-6px 0 14px"></p>

    <div class="gauge-grid">
      <div class="card gauge-card">
        <div class="gauge" id="gaugeIntake"></div>
        <div class="gauge-title">今日摄入 🔥</div>
        <div class="gauge-sub" id="intakeSub">-- kcal</div>
        <div class="gauge-sub muted" id="intakeMacro"></div>
      </div>
      <div class="card gauge-card">
        <div class="gauge" id="gaugeBurn"></div>
        <div class="gauge-title">今日消耗 🏃</div>
        <div class="gauge-sub" id="burnSub">-- kcal</div>
        <div class="gauge-sub muted" id="burnNote">基础代谢 + 运动</div>
      </div>
    </div>

    <div class="card stat-card">
      <span class="stat-title" id="fatTitle">今日预计减脂 ⚡</span>
      <span class="big-num" id="fatText">-- g</span>
      <span class="stat-label" id="fatNote">按（消耗−摄入）粗略折算，仅供参考</span>
    </div>

    <div class="card stat-card">
      <span class="stat-title">连胜天数 💧</span>
      <span class="big-num" id="streakText">0 天</span>
      <span class="stat-label">饮水达标天数，去大水页打卡</span>
    </div>

    <div class="card">
      <h2>三大营养素</h2>
      <div class="macro-gauges">
        <div class="macro-gauge">
          <div class="gauge gauge-mini" id="gaugeProtein"></div>
          <div class="macro-name">🥩 蛋白</div>
          <div class="macro-status small" id="proteinStatus">--</div>
        </div>
        <div class="macro-gauge">
          <div class="gauge gauge-mini" id="gaugeCarb"></div>
          <div class="macro-name">🍚 碳水</div>
          <div class="macro-status small" id="carbStatus">--</div>
        </div>
        <div class="macro-gauge">
          <div class="gauge gauge-mini" id="gaugeFat"></div>
          <div class="macro-name">🥑 脂肪</div>
          <div class="macro-status small" id="fatStatus">--</div>
        </div>
      </div>
    </div>
  </div>

  <nav class="tabbar">
    <a href="index.html"><span class="tab-icon">🏠</span>首页</a>
    <a href="water.html"><span class="tab-icon">💧</span>大水</a>
    <a href="eat.html"><span class="tab-icon">🍚</span>饮食</a>
    <a href="move.html"><span class="tab-icon">🏃</span>运动</a>
    <a href="sleep.html"><span class="tab-icon">🌙</span>睡眠</a>
    <a href="week.html"><span class="tab-icon">📈</span>复盘</a>
  </nav>

  <script src="js/storage.js"></script>
  <script src="js/calculator.js"></script>
  <script src="js/water.js"></script>
  <script src="js/exporter.js"></script>
  <script src="js/menu.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
